services:
  app:
    build: .
    container_name: rootprint
    restart: always
    depends_on:
      db:
        condition: service_healthy
      quickwit:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://rootprint:rootprint@db:5432/rootprint
      - QUICKWIT_URL=http://quickwit:7280
      - ORIGIN=http://localhost:8282

      # --- Tunda, and all of it required --------------------------------------
      #
      # This console authenticates nobody. Every session comes from a Tunda
      # authorization-code flow, so without a configured issuer it has no
      # authentication authority at all and the only safe thing it can do with a
      # request is refuse it — which is why it refuses to start instead.
      #
      # It checks these before it connects to Postgres, so a missing one names
      # itself rather than being discovered at the first sign-in.
      #
      # See FORK.md. Replace every value below.
      # The complete issuer, exactly as a token's `iss` carries it — not an
      # origin. Compared verbatim, so there is nothing to compose and nothing to
      # disagree with.
      - TUNDA_ISSUER=https://id.example.com/t/tnt_REPLACE_ME
      - TUNDA_CLIENT_ID=observability-console
      # private_key_jwt (ADR 0036's preferred method). This console holds no
      # shared secret: it signs a fresh, single-use assertion per back-channel
      # call and Tunda holds only the public half of the key.
      - TUNDA_CLIENT_KEY_ID=console-key-1
      - TUNDA_CLIENT_PRIVATE_KEY=<PKCS#8 PEM, one line with \n or a mounted file>
      - TUNDA_AUDIENCE=https://observability.example.com
      - TUNDA_REDIRECT_URI=http://localhost:8282/api/auth/callback

      # Which deployment this is, as a telemetry producer's token names it. A
      # token issued for `staging` resolves no destination here when this says
      # `production`, and the batch is refused.
      - TUNDA_ENVIRONMENT=production

      # 32 bytes of base64, and NEVER generated: openssl rand -base64 32
      #
      # A generated key would make every session on every other replica
      # undecryptable and would rotate on each restart, which presents as
      # "everybody is randomly signed out" rather than as a missing secret.
      - CONSOLE_SESSION_KEY=replace-me-with-32-bytes-of-base64
    ports:
      - '8282:8282'

  db:
    image: postgres:17
    container_name: rootprint-postgres
    restart: always
    environment:
      - POSTGRES_USER=rootprint
      - POSTGRES_PASSWORD=rootprint
      - POSTGRES_DB=rootprint
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rootprint']
      interval: 5s
      timeout: 3s
      retries: 10

  quickwit:
    image: quickwit/quickwit:edge
    container_name: quickwit
    ports:
      - '127.0.0.1:7280:7280' # REST API + Web UI (local only)
      - '127.0.0.1:7281:7281' # gRPC (local only)
    volumes:
      - ./quickwit.yaml:/quickwit/config/quickwit.yaml:ro
      - ./.quickwit/qwdata:/quickwit/qwdata
    command: ['run']
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/7280"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
